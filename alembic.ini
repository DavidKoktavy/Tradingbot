[alembic]
script_location = migrations
# The URL is supplied at runtime from app.config so credentials are never
# committed. This placeholder is only used by `alembic` invoked directly
# without the env var set, and points at a local SQLite file.
sqlalchemy.url = sqlite:///local_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
