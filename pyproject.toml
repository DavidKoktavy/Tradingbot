[project]
name = "trading-agent"
version = "0.1.0"
description = "Modular autonomous trading agent for Interactive Brokers with a deterministic risk boundary between AI reasoning and order execution."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    # Verified in Phase 2: ib_async (github.com/ib-api-reloaded/ib_async)
    # is the actively maintained successor to ib_insync, whose original
    # maintainer passed away in early 2024. ib_insync is unmaintained;
    # ib_async is API-compatible and used as a drop-in replacement.
    "ib_async>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # starlette's TestClient (used by FastAPI, used by our dashboard
    # tests) now prefers httpx2 over the plain httpx package. Pinning it
    # explicitly avoids "RuntimeError: The starlette.testclient module
    # requires the httpx2 package" on a fresh install against current
    # starlette releases.
    "httpx2",
    "psutil>=5.9",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
trading-agent = "app.cli:main"

[tool.setuptools]
packages = [
    "trading_agent", "app", "broker", "strategies", "ai", "risk",
    "portfolio", "execution", "backtesting", "data", "monitoring",
    "database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
